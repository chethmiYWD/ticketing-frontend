<!-- Navbar with Links to Calendar, History, and Profile -->
<div class="navbar">
  <a routerLink="calendar" routerLinkActive="active-link">Calendar</a>
  <a routerLink="history" routerLinkActive="active-link">History</a>
  <a routerLink="profile" routerLinkActive="active-link">Profile</a>
</div>

<!-- Main Dashboard Content Area -->
<div class="dashboard">
  <!-- Search Bar Section -->
  <div class="search-bar">
    <input
      type="text"
      placeholder="Search by event name or artist"
      [(ngModel)]="searchQuery"
      (input)="onSearch()"
    />
  </div>

  <!-- Event Cards Display -->
  <div class="events-grid">
    <div
      class="event-card"
      *ngFor="let event of filteredEvents"
      (click)="viewEventDetails(event)"
    >
      
      <div class="event-info">
        <h3>{{ event.name }}</h3>
        <p><strong>Date:</strong> {{ event.date | date: 'mediumDate' }}</p>
        <p><strong>Price:</strong> ${{ event.ticketPrice }}</p>
        <p><strong>Artist:</strong> {{ event.artist || 'N/A' }}</p>
        <button (click)="bookTicket(event, $event)">Book Ticket</button>
      </div>
    </div>
  </div>

  <!-- Show message if no events are found -->
  <div *ngIf="filteredEvents.length === 0 && events.length > 0">
    <p>No events match your search criteria.</p>
  </div>
  <div *ngIf="events.length === 0">
    <p>Loading events...</p>
  </div>
</div>

<!-- Router Outlet for Calendar, History, and Profile Pages -->
<div class="content-area">
  <router-outlet></router-outlet>
</div>
