<!-- Customer dashboard -->
<div class="dashboard">

  <button class="logout-btn" (click)="logout()">Logout</button>

  <!-- Search Bar Section -->
  <div class="search-bar">
    <input
      type="text"
      placeholder="Search by event name or artist"
      [(ngModel)]="searchQuery"
      (input)="onSearch()"
    />
  </div>

  <!-- Event Cards Display -->
  <div class="events-grid">
    <div
      class="event-card"
      *ngFor="let event of filteredEvents"
      (click)="viewEventDetails(event)"
    >
      
      <div class="event-info">
        <h3>{{ event.name }}</h3>
        <p><strong>Date:</strong> {{ event.date | date: 'mediumDate' }}</p>
        <p><strong>Price:</strong> ${{ event.ticketPrice }}</p>
        <button (click)="bookTicket(event, $event)">Book Ticket</button>
      </div>
    </div>
  </div>

  <!-- Search bar -->
  <div *ngIf="filteredEvents.length === 0 && events.length > 0">
    <p>No events match your search criteria.</p>
  </div>
  <div *ngIf="events.length === 0">
    <p>Loading events...</p>
  </div>
</div>
