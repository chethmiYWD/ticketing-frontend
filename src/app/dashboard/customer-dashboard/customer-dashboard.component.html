<div class="customer-dashboard">
    <h2>Customer Dashboard</h2>
  
    <!-- Ticket Retrieval Section -->
    <div class="ticket-retrieval">
      <label for="retrieveCount">Tickets to Retrieve:</label>
      <input
        type="number"
        id="retrieveCount"
        [(ngModel)]="retrieveCount"
        name="retrieveCount"
        min="1"
        placeholder="Enter number of tickets"
      />
      <button (click)="retrieveTickets()">Retrieve Tickets</button>
    </div>
  
    <!-- Error/Success Messages -->
    <div *ngIf="message" class="message">
      {{ message }}
    </div>
  
    <!-- Current Ticket Pool Status -->
    <div class="ticket-pool-status">
      <h3>Ticket Pool Status</h3>
      <p>Total Tickets Available: {{ ticketPool }}</p>
    </div>
  </div>
