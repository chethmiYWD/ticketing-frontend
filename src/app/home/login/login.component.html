<div class="login-container">
  <h2>Login</h2>
  <form #loginForm="ngForm" (ngSubmit)="onSubmit(loginForm)" novalidate>
    <!-- Email Field -->
    <div>
      <label for="email">Email:</label>
      <input
        type="email"
        id="email"
        name="email"
        [(ngModel)]="credentials.email"
        required
        email
      />
      <div class="error" *ngIf="loginForm.submitted && !credentials.email">
        Email is required.
      </div>
    </div>

    <!-- Password Field -->
    <div>
      <label for="password">Password:</label>
      <input
        type="password"
        id="password"
        name="password"
        [(ngModel)]="credentials.password"
        required
      />
      <div class="error" *ngIf="loginForm.submitted && !credentials.password">
        Password is required.
      </div>
    </div>

    <!-- Submit Button -->
    <button type="submit">Login</button>
  </form>
</div>
